name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum
      - run: make test build
        working-directory: plugin
      - run: gh release create "$GITHUB_REF_NAME" plugin/navidrome-rpc.ndp --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
